name: Package Extension
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vercel-migration/extension/**'
      - '.github/workflows/package-extension.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build extension zip
        run: |
          cd vercel-migration/extension
          zip -r ../public/resources/VIDEO_IMAGE_STUDIO_ChatGPT_Extension_v0.4.15.zip . -x '*.DS_Store'
      - name: Commit package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vercel-migration/public/resources/VIDEO_IMAGE_STUDIO_ChatGPT_Extension_v0.4.15.zip
          git diff --cached --quiet && exit 0
          git commit -m 'build: publish extension v0.4.15'
          git push
