name: Verify separation tab
on:
  push:
    branches: [vercel-migration]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vercel-migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - id: webbuild
        run: npm run build > build.log 2>&1 || echo "failed=true" >> "$GITHUB_OUTPUT"
      - run: python3 -m py_compile local-engine/app.py local-engine/sam2_adapter.py local-engine/layers.py local-engine/semantic.py local-engine/install.py > python.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: separation-build-logs
          path: |
            vercel-migration/build.log
            vercel-migration/python.log
      - if: steps.webbuild.outputs.failed == 'true'
        run: cat build.log && exit 1
